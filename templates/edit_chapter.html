{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Subject</h2>
    <form method="POST" action="{{ url_for('edit_chapter', chapter_id=chapter.id) }}">
        <div class="mb-3">
            <label for="chapter_name" class="form-label">chapter Name</label>
            <input type="text" class="form-control" id="chapter_name" name="chapter_name" value="{{ chapter.chapter_name }}" required>
        </div>
        <div class="mb-3">
            <label for="chapter_description" class="form-label">Description</label>
            <textarea class="form-control" id="chapter_description" name="chapter_description" rows="3" required>{{ chapter.chapter_description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update Chapter</button>
        <a href="{{ url_for('admin_home') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
