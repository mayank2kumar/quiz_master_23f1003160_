{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Question</h2>
    <form method="POST" action="{{ url_for('edit_question', question_id=question.id) }}">
        <div class="mb-3">
            <label for="question_title" class="form-label">Question Title</label>
            <input type="text" class="form-control" id="question_title" name="question_title" value="{{ question.question_title }}" required>
        </div>
        <div class="mb-3">
            <label for="question_text" class="form-label">Question Text</label>
            <textarea class="form-control" id="question_text" name="question_text" rows="3" required>{{ question.question_text }}</textarea>
        </div>
        <div class="mb-3">
            <label for="option1" class="form-label">Option 1</label>
            <input type="text" class="form-control" id="option1" name="option1" value="{{ question.option1 }}" required>
        </div>
        <div class="mb-3">
            <label for="option2" class="form-label">Option 2</label>
            <input type="text" class="form-control" id="option2" name="option2" value="{{ question.option2 }}" required>
        </div>
        <div class="mb-3">
            <label for="option3" class="form-label">Option 3</label>
            <input type="text" class="form-control" id="option3" name="option3" value="{{ question.option3 }}" required>
        </div>
        <div class="mb-3">
            <label for="option4" class="form-label">Option 4</label>
            <input type="text" class="form-control" id="option4" name="option4" value="{{ question.option4 }}" required>
        </div>
        <div class="mb-3">
                <label for="answer" class="form-label"><strong>Answer:</strong></label>
                <select id="answer" name="answer" class="form-control" required>
                    <option value="" disabled selected>{{question.answer}}</option>
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                    <option value="option4">Option 4</option>
                </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Question</button>
        <a href="{{ url_for('quiz') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
