{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-warning">New Subject</h2>

    <div class="card p-4 shadow-lg">
        <form method="POST" action="{{ url_for('new_subject') }}">
            <div class="mb-3">
                <label for="subject_name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="subject_name" name="subject_name" required>
            </div>

            <div class="mb-3">
                <label for="subject_code" class="form-label">Subject Code:</label>
                <input type="text" class="form-control" id="subject_code" name="subject_code" required>
            </div>

            <div class="mb-3">
                <label for="subject_description" class="form-label">Description:</label>
                <textarea class="form-control" id="subject_description" name="subject_description"></textarea>
            </div>

            <div class="mb-3">
                <label for="subject_credit" class="form-label">Credits:</label>
                <input type="number" class="form-control" id="subject_credit" name="subject_credit" required>
            </div>


            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <a href="{{ url_for('admin_home') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
