{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-warning">New Quiz</h2>

    <div class="card p-4 shadow-lg">
        <form method="POST" action="{{ url_for('new_quiz') }}">

            <div class="mb-3">
                <label for="chapter_id" class="form-label">Select Chapter:</label>
                <select class="form-select" id="chapter_id" name="chapter_id" required>
                    <option value="" selected disabled>-- Select a Chapter --</option>
                    {% for chapter in chapters %}
                        {% if chapter.quiz|length == 0 %}
                            <option value="{{ chapter.id }}"><strong>{{ chapter.chapter_name }}</strong></option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="quiz_name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="quiz_name" name="quiz_name" required>
            </div>

            <div class="mb-3">
                <label for="quiz_description" class="form-label">Description:</label>
                <textarea class="form-control" id="quiz_description" name="quiz_description"></textarea>
            </div>

            <div class="mb-3">
                <label for="time_duration" class="form-label">Time duration (hh:mm):</label>
                <input type="text" class="form-control" id="time_duration" placeholder="hh:mm" name="time_duration" pattern="([01]?[0-9]|2[0-3]):([0-5]?[0-9])" required>
            </div>


            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <a href="{{ url_for('quiz') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
