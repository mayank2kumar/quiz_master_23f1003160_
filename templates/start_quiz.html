{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-primary text-center">Start the Quiz</h2>

    <div class="text-start">
        <span class="badge bg-success fs-5">QNo. {{ number }}/{{quiz.questions | length }}</span>
    </div>
    <div class="border border-3 border-dark p-3 mt-4">
        <h5 class="text-secondary">Question {{ number }}:</h5>
        <p>{{ question.question_text }}</p>
    </div>
    <form method="post" class="text-center">
    <div class="form-check my-3 d-flex justify-content-center align-items-center">
        <input class="form-check-input me-2" type="radio" name="option" id="option1" value="{{ question.option1 }}"
            {% if selected_answer == question.option1 %}checked{% endif %}>
        <label class="form-check-label" for="option1">{{ question.option1 }}</label>
    </div>
    <div class="form-check my-3 d-flex justify-content-center align-items-center">
        <input class="form-check-input me-2" type="radio" name="option" id="option2" value="{{ question.option2 }}"
            {% if selected_answer == question.option2 %}checked{% endif %}>
        <label class="form-check-label" for="option2">{{ question.option2 }}</label>
    </div>
    <div class="form-check my-3 d-flex justify-content-center align-items-center">
        <input class="form-check-input me-2" type="radio" name="option" id="option3" value="{{ question.option3 }}"
            {% if selected_answer == question.option3 %}checked{% endif %}>
        <label class="form-check-label" for="option3">{{ question.option3 }}</label>
    </div>
    <div class="form-check my-3 d-flex justify-content-center align-items-center">
        <input class="form-check-input me-2" type="radio" name="option" id="option4" value="{{ question.option4 }}"
            {% if selected_answer == question.option4 %}checked{% endif %}>
        <label class="form-check-label" for="option4">{{ question.option4 }}</label>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('start_quiz', number=(number % quiz.questions|length) + 1, quiz_id=quiz.id, question_number=(number % quiz.questions|length) + 1) }}" class="btn btn-primary">Next</a>
        <a href="{{ url_for('start_quiz', number=(number-2) % quiz.questions|length + 1, quiz_id=quiz.id, question_number=(number-2) % quiz.questions|length + 1) }}" class="btn btn-primary">Previous</a>
        <a href="{{ url_for('submit_quiz', quiz_id=quiz.id) }}" class="btn btn-success">Submit</a>
    </div>
</form>

    <style>
        .form-check-input {
            border-color: #000;
        }
    </style>
</div>
{% endblock %}
