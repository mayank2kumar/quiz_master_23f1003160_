{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Quiz</h2>
    <form method="POST" action="{{ url_for('edit_quiz', quiz_id=quiz.id) }}">
        <div class="mb-3">
            <label for="quiz_name" class="form-label">Name:</label>
            <input type="text" class="form-control" id="quiz_name" name="quiz_name" value="{{ quiz.quiz_name }}" required>
        </div>
        <div class="mb-3">
            <label for="quiz_description" class="form-label">Description</label>
            <textarea class="form-control" id="quiz_description" name="quiz_description" rows="3" required>{{ quiz.quiz_description }}</textarea>
        </div>
        <div class="mb-3">
                <label for="time_duration" class="form-label">Time duration (hh:mm):</label>
                <input type="text" class="form-control" id="time_duration" placeholder="hh:mm" name="time_duration" pattern="([01]?[0-9]|2[0-3]):([0-5]?[0-9])" value="{{quiz.time_duration}}"required>
            </div>
        <button type="submit" class="btn btn-primary">Update Subject</button>
        <a href="{{ url_for('quiz') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
