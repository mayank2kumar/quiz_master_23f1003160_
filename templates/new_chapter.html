{% extends "layout.html" %}

{% block content %}
    <div class="container mt-4">
        <h2 class="text-center">Add New Chapter</h2>
        <form method="POST" action="{{ url_for('new_chapter') }}">

            <h2>Adding Chapter to: {{ subject.subject_name }}</h2>  <!-- Show Subject Name -->

            <!-- Make sure the subject_id is set correctly -->
            <input type="hidden" name="subject_id" value="{{ subject.id }}">

            <div class="mb-3">
                <label for="chapter_name" class="form-label"><strong>Chapter Name:</strong></label>
                <input type="text" id="chapter_name" name="chapter_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="chapter_description" class="form-label"><strong>Description:</strong></label>
                <textarea id="chapter_description" name="chapter_description" class="form-control" rows="3"></textarea>
            </div>

            {# <label for="subject_id">Subject:</label>
            <select id="subject_id" name="subject_id" class="form-control" required>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if subject.id|string == selected_subject_id %}selected{% endif %}>
                        {{ subject.subject_name }}
                    </option>
                {% endfor %}
            </select> #}

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('admin_home') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
